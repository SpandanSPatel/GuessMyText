# =============================================================================
# GuessMyText — Render Infrastructure as Code (Blueprint)
# Deploy with one click by connecting your repository to Render Blueprints.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Flask Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: guessmytext-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "*"

  # ---------------------------------------------------------------------------
  # 2. Vite + React Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: guessmytext-frontend
    runtime: static
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: guessmytext-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
